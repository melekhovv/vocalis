name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, Lint & Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install shell dependencies
        working-directory: app
        run: npm ci

      - name: TypeScript typecheck
        working-directory: app
        run: npm run typecheck

      - name: Run Electron shell tests
        working-directory: app
        run: |
          node tests/startup.cjs
          node tests/settings.cjs
          node tests/deps-and-hotkeys.cjs

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Verify engine lockfile
        run: uv lock --check --project engine

      - name: Engine linter (ruff)
        run: uv run --with ruff ruff check --select E4,E7,E9,F --ignore E402,E701,E722 engine/vcengine

      - name: Create Engine CI venv
        working-directory: engine
        run: uv venv --python 3.11 .venv-ci

      - name: Install Engine test dependencies (CPU)
        working-directory: engine
        run: >
          uv pip install
          --python .venv-ci/Scripts/python.exe
          --index-strategy unsafe-best-match
          --extra-index-url https://download.pytorch.org/whl/cpu
          "numpy==2.4.6"
          "scipy==1.17.1"
          "librosa==0.11.0"
          "soundfile==0.14.0"
          "soxr==1.1.0"
          "faiss-cpu==1.14.3"
          "torch==2.11.0"
          "torchaudio==2.11.0"
          "torchcrepe==0.0.24"
          "torchfcpe==0.0.4"
          "einops==0.8.2"
          "transformers==5.13.1"
          "stftpitchshift==2.0"
          "onnxruntime>=1.22.0"
          "sounddevice==0.5.5"
          "webrtcvad-wheels==2.0.14"
          "psutil==7.2.2"
          "nvidia-ml-py>=12.560"
          "requests==2.34.2"
          "tqdm==4.68.4"
          "fastapi>=0.110.0"
          "uvicorn>=0.30.0"
          "websockets>=13.0"

      - name: Run Engine unit tests
        working-directory: engine
        run: .venv-ci\Scripts\python.exe -B -m unittest discover -s tests -p "test_*.py" -v

  build:
    name: Package Windows Installer
    needs: checks
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install shell dependencies
        working-directory: app
        run: npm ci

      - name: Build Windows Installer (NSIS)
        shell: powershell
        run: .\scripts\build.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vocalis-Windows-Installer
          path: |
            app/release/Vocalis-Setup-*.exe
            app/release/Vocalis-Setup-*.exe.blockmap
            app/release/latest.yml
            app/release/SHA256SUMS.txt
          if-no-files-found: error
