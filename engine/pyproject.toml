[project]
name = "vocalis-engine"
version = "0.2.4"
description = "Local real-time RVC voice conversion engine for Vocalis"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.4.6",
  "scipy==1.17.1",
  "librosa==0.11.0",
  "soundfile==0.14.0",
  "soxr==1.1.0",
  "faiss-cpu==1.14.3",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchcrepe==0.0.24",
  "torchfcpe==0.0.4",
  "einops==0.8.2",
  "transformers==5.13.1",
  "stftpitchshift==2.0",
  "onnxruntime>=1.22.0",
  "sounddevice==0.5.5",
  "webrtcvad-wheels==2.0.14",
  "psutil==7.2.2",
  "nvidia-ml-py>=12.560",
  "requests==2.34.2",
  "tqdm==4.68.4",
  "fastapi>=0.110.0",
  "uvicorn>=0.30.0",
  "websockets>=13.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  "vendor",
  ".venv",
  "profiles",
  "assets",
  "data",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F841", "E701"]

[tool.pyright]
include = ["vcengine"]
exclude = ["vendor", "tests", "profiles", ".venv"]
extraPaths = ["vendor"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportArgumentType = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"
reportOperatorIssue = "none"
