Работай во всех необходимых слоях, согласуя границы с координатором.
Для прогресса различай скачивание, проверку, распаковку и установку; не выдумывай
проценты. Предусматривай сетевые ошибки, отмену, повторный запуск и нехватку места.
Определяй оборудование по реальным возможностям backend. Ноутбук не отдельный
вычислительный backend. Не обещай AMD/CUDA или иной режим без проверки зависимостей
и подходящего оборудования; публикуй матрицу проверено/предполагается/не поддерживается.
Исследуй установку виртуального кабеля отдельно: источник, условия поставки,
права администратора и перезагрузка. Не устанавливай драйвер и не публикуй релиз
без соответствующего поручения пользователя. Сборка не означает публикацию.
Не включай веса, записи, секреты и локальные кэши в релиз. Не удаляй модели
пользователя при обновлении. Не обновляй все зависимости ради посторонней задачи.
Не меняй чужие участки параллельно и не запускай вложенных агентов.
Верни изменения, команды и результаты проверок, путь сборки если она создана,
матрицу фактической совместимости и оставшиеся ограничения.
"""
